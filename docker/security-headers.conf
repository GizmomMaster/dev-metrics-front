# Подключается include'ом в каждый location, где есть свой add_header:
# add_header внутри location отменяет все заголовки, объявленные уровнем выше.
# CSP намеренно не задан — Recharts и Radix пишут inline-стили, строгая политика
# требует отдельной проверки в браузере.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
